model:
  vocab_size: 33
  hidden_size: 768
  num_hidden_layers: 24
  num_loops: 1
  loop_strategy: stack
  loop_start: 0
  loop_end: null
  num_attention_heads: 12
  head_dim: 64
  intermediate_size: 2048
  max_position_embeddings: 512
  rope_theta: 10000.0
  rope_dim: 64
  nope_dim: 0
  norm_type: layernorm
  norm_eps: 1.0e-06
  norm_strategy: sandwich
  qk_norm: true
  qk_norm_mode: channel
  qk_norm_l2_scale_init: null
  post_embed_norm: false
  mask_dropout: false
  mask_dropout_reference_ratio: 0.12
  residual_scaling: sqrt_num_layers
  residual_gate: channel
  residual_gate_init: 1.0
  attn_output_gate: sigmoid
  value_residual: learnable
  value_residual_lambda_init: 0.5
  init_scale_output_projections: true
  ffn_activation: swiglu
  ffn_bias: false
  attention_dropout: 0.0
  hidden_dropout: 0.0
  mlm_head_activation: gelu
  canon_enabled: true
  canon_residual: true
  canon_positions:
  - A
  - B
  - C
  - D
  canon_kernel_sizes:
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  - 7
  canon_activation: none
  initializer_range: 0.02
  mup_enable: true
  mup_base_width: 768
  mup_output_mult: 0.5
  classifier_pool: mean
  classifier_dropout: 0.0
  pre_head_norm: false
  gradient_checkpointing: false
  gradient_checkpointing_mode: full
  unk_token_id: 3
  mask_token_id: 32
  return_dict: true
  output_hidden_states: false
  dtype: null
  chunk_size_feed_forward: 0
  is_encoder_decoder: false
  architectures: null
  id2label:
    0: LABEL_0
    1: LABEL_1
  label2id:
    LABEL_0: 0
    LABEL_1: 1
  problem_type: null
  _name_or_path: ''
  transformers_version: 5.3.0
  pad_token_id: 1
  bos_token_id: 0
  eos_token_id: 2
  tie_word_embeddings: false
  model_type: oplm
  output_attentions: false
train:
  max_steps: 100000
  max_epochs: null
  batch_size: 256
  gradient_accumulation_steps: 1
  optimizer: muon
  lr: 0.0035
  min_lr: 0.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.98
  adam_eps: 1.0e-08
  muon_adjust_lr_fn: original
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  mup_depth_lr_exponent: 0.5
  mup_depth_reference_layers: 24
  adamw_lr_mult: 0.33
  embedding_weight_decay: 0.01
  weight_decay_to_init: 0.01
  max_grad_norm: 1.0
  scheduler: wsd_linear
  warmup_steps: 5000
  stable_steps: 85000
  log_every: 10
  eval_every:
    steps: 5000
  wandb_project: oplm-scaling
  wandb_run_name: 170M-v2-adamdiv3
  wandb_enabled: true
  save_every: 10000
  save_total_limit: 3
  save_final: true
  init_from: null
  resume_from: null
  branch_from: null
  save_every_minutes: 30
  keep_every_n_steps: 100000
  keep_every_n_hours: null
  auto_resume: true
  resume_data_position: true
  dist_timeout_minutes: 15
  remote_checkpoint_uri: null
  ema_decay: null
  parallelism: ddp
  seed: 42
  output_dir: /mnt/home/briney/projects/oplm/scaling/170M-v2-adamdiv3
  config_path: /mnt/home/briney/projects/oplm/scaling/configs/scaling-v2.yaml
  mixed_precision: bf16
  compile: true
  compile_mode: default
  compile_dynamic: true
  throughput_warmup_steps: 50
  peak_tflops: null
  stability_diagnostics: false
  stability_probe_every: 25
  weight_diag_every: 0
  profile_start: null
  profile_steps: 20
data:
  train:
    uniref70:
      path: /mnt/data/datasets/plm-training-data/uniref70_omg70/uniref70/train
      fraction: 0.25
    deepclust70:
      path: /mnt/data/datasets/plm-training-data/deepclust70/train
      fraction: 0.75
  eval:
    uniref70:
      path: /mnt/data/datasets/plm-training-data/uniref70_omg70/uniref70/eval.parquet
      type: sequence
    omg70:
      path: /mnt/data/datasets/plm-training-data/uniref70_omg70/omg70/eval.parquet
      type: sequence
    deepclust70_gte2:
      path: /mnt/data/datasets/plm-training-data/deepclust70/eval_gte2.parquet
      type: sequence
    deepclust70_singletons:
      path: /mnt/data/datasets/plm-training-data/deepclust70/eval_singletons.parquet
      type: sequence
    casp14:
      path: /mnt/data/datasets/plm-training-data/casp/casp14
      type: structure
    proteingym_clinical:
      path: /mnt/data/datasets/plm-training-data/ProteinGym/eval/clinical_substitutions
      type: proteingym_clinical
      scoring: wt_marginals
      top_k_fraction: 0.1
    proteingym_dms:
      path: /mnt/data/datasets/plm-training-data/ProteinGym/eval/dms_substitutions
      type: proteingym
      scoring: wt_marginals
      top_k_fraction: 0.1
  mask_prob: 0.15
  mask_token_prob: 0.8
  random_token_prob: 0.1
  weighted_masking: false
  pad_to_multiple_of: null
  pack_sequences: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  shuffle_shards: true
  shuffle_rows: true
  reshuffle_on_refill: true
  drop_last: true
