[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oplm"
version = "0.1.4"
description = "open protein language model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Bryan Briney", email = "briney@scripps.edu" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    # Upper bounds keep CI on the verified-good toolchain: torch 2.12 is untested,
    # and transformers >=5.4 shifts PretrainedConfig attribute typing so `ty`
    # reports resolved-Optional config fields (head_dim, intermediate_size, ...) as
    # errors. Bump deliberately after re-running `ty check src/` + the test suite.
    # Floor is 2.10 (verified in production training runs, incl. torch.optim.Muon,
    # which ships in 2.10). torch 2.11 only adds the FlashAttention-4 SDPA backend on
    # Blackwell — a perf gain, not a correctness requirement: on 2.10 SDPA falls back
    # to the cuDNN/efficient/flash kernels. Raise the floor only if FA-4 becomes required.
    "torch>=2.10.0,<2.12",
    "transformers>=4.45,<5.4",
    "omegaconf>=2.3",
    "typer>=0.9",
    "rich>=13.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
train = [
    "accelerate>=0.30",
    "deepspeed>=0.14",
    "wandb>=0.16",
    "datasets>=2.18",
    "biopython>=1.83",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    # ty is Astral's type checker (pre-1.0/beta). Pin an EXACT version: its
    # diagnostics shift between releases, so an unpinned range lets CI pull a newer
    # ty that flags code an older ty accepts. Bump deliberately. See
    # [tool.ty.environment] below.
    "ty==0.0.40",
]

[project.scripts]
oplm = "oplm.cli:app"

[project.urls]
Homepage = "https://github.com/briney/oplm"
Repository = "https://github.com/briney/oplm"
Issues = "https://github.com/briney/oplm/issues"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["oplm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.environment]
python-version = "3.11"
