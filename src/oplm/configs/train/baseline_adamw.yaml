# Classic AdamW baseline — turns μP OFF and switches to AdamW.
#
# OPLM trains with μP + Muon by default (see configs/train/base.yaml). This overlay
# is the opt-out: an ablation / A-B comparison against the μP recipe, or a plain
# AdamW run. Pass it with --config on top of a size --preset:
#
#   oplm train --preset 400M --config src/oplm/configs/train/baseline_adamw.yaml \
#     data.train=/data/uniref50/ train.lr=<adamw-lr-for-this-size>
#
# IMPORTANT: with μP off, `lr` no longer transfers across width. The value below is
# a generic AdamW starting point — retune it for your model size. See docs/MUP.md.
train:
  optimizer: adamw
  lr: 1.0e-4
  muon_adjust_lr_fn: match_rms_adamw # restore the library default (inert for AdamW)

model:
  mup_enable: false
