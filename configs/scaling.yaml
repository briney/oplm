# The production training recipe: the settings of the 170M long run (W&B
# thebrineylab/oplm-170M-long, run 170M-lr0.0063-long), stated as overrides on top of the
# packaged defaults (src/oplm/configs/train/base.yaml and the model preset). Token mode: the
# global batch is train.tokens_per_step; per-device batch and accumulation are derived from
# slurm.max_batch_tokens. Usable on its own:
#   oplm slurm generate --config configs/scaling.yaml --preset 170M --out jobs/170M
# `oplm sweep scale` merges the confirmed muP winner into this file before generating.
# Cluster paths, partition and container are placeholders: edit them for your site.

model:
  max_position_embeddings: 2048
  packed_attention: flex
  residual_gate: none

train:
  # Tuned at 4M tok/step for 24k steps. PENDING(#55): best LR falls with training length;
  # production value comes from the LR-vs-length extrapolation (docs/mup-lr.md).
  lr: 0.0063
  weight_decay_to_init: 0.1
  tokens_per_step: 4194304
  # Per-device micro-batch (170M run: 65536 x 2 accumulation steps x 32 GPUs = tokens_per_step).
  # `oplm slurm generate` re-derives this per preset from slurm.max_batch_tokens.
  batch_tokens: 65536
  scheduler: wsd_linear
  # 170M long-run horizon. PENDING(#55): production horizon.
  # 2k warmup + 248k stable + 50k decay = 300k max_steps. Keep warmup_steps + stable_steps
  # strictly less than max_steps so the decay phase exists (the sweep-phase convention of
  # stable_steps = max_steps - warmup_steps is for short proxy runs and does not belong here).
  max_steps: 300000
  stable_steps: 248000
  warmup_steps: 2000
  save_every: 5000
  # Retain a permanent checkpoint every 50k steps, exempt from save_total_limit rotation.
  keep_every_n_steps: 50000
  # Resume from the newest committed checkpoint under output_dir on every restart, so a
  # requeue after preemption continues training instead of restarting from step 0.
  auto_resume: true
  parallelism: ddp
  compile: true
  compile_dynamic: false

data:
  pack_sequences: true
  train:
    # PENDING(#61): paths become the published training-set layout.
    # Rows, not tokens (0.05 rows ≈ 11% tokens). PENDING(#58): production mix.
    uniref70:
      path: /path/to/oplm-training-data/uniref70/train
      fraction: 0.05
    deepclust70:
      path: /path/to/oplm-training-data/deepclust70/train
      fraction: 0.95
  eval:
    uniref70:
      path: /path/to/oplm-training-data/uniref70/eval.parquet
      type: sequence
      every: {steps: 500}
    # Structure evals (contact precision@L), published as brineylab/oplm-structure-evals.
    pdb40:
      path: /path/to/oplm-structure-evals/pdb40_256
      type: structure
      every: {steps: 5000}
    pdb40_2048:
      path: /path/to/oplm-structure-evals/pdb40_2048
      type: structure
      every: {steps: 50000}
    cameo:
      path: /path/to/oplm-structure-evals/cameo_256
      type: structure
      every: {steps: 5000}
    casp:
      path: /path/to/oplm-structure-evals/casp15_16
      type: structure
      every: {steps: 5000}

slurm:
  partition: gpu
  time_limit:
    default: "168:00:00"
  cpus_per_task: 128
  gpus_per_node: 8
  exclusive: true
  mem: "0"
  log_dir: /path/to/logs
  env_file: /path/to/.env
  container_image: /path/to/deeplearning.sqsh
  container_mounts:
    - /path/to/data:/path/to/data
    - /tmp:/tmp
  install: pip install oplm[train]
  max_concurrent: 4
  # Requeue budget for the rendered sbatch requeue wrapper.
  max_requeues: 20
  nodes: {170M: 4, 400M: 8, 800M: 16, 1B: 16}
  # Per-device micro-batch cap in tokens; the 170M run used 65536 with 2 accumulation steps.
  max_batch_tokens: {170M: 65536, 400M: 32768, 800M: 16384, 1B: 16384}
